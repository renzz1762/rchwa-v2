<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCH Tools - Reaction Channel WhatsApp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(120, 115, 245, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255, 110, 196, 0.15) 0%, transparent 50%);
  }
  .container {
    width: 100%;
    max-width: 480px;
  }
  .card {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo {
    width: 60px;
    height: 60px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, #ff6ec4 0%, #7873f5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 8px 24px rgba(120, 115, 245, 0.4);
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 13px;
    color: #888;
  }
  .field {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input[type="text"], select {
    width: 100%;
    padding: 14px 16px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
  }
  input[type="text"]:focus, select:focus {
    border-color: #7873f5;
    background: rgba(0, 0, 0, 0.6);
    box-shadow: 0 0 0 3px rgba(120, 115, 245, 0.15);
  }
  input::placeholder { color: #555; }
  .emoji-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .emoji-btn {
    flex: 1;
    min-width: 50px;
    padding: 12px 8px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    font-size: 22px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .emoji-btn:hover {
    background: rgba(120, 115, 245, 0.15);
    border-color: rgba(120, 115, 245, 0.5);
    transform: translateY(-2px);
  }
  .emoji-btn.active {
    background: linear-gradient(135deg, rgba(255, 110, 196, 0.3), rgba(120, 115, 245, 0.3));
    border-color: #7873f5;
    box-shadow: 0 0 0 3px rgba(120, 115, 245, 0.2);
  }
  button.submit {
    width: 100%;
    padding: 15px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    font-family: inherit;
  }
  button.submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(120, 115, 245, 0.4);
  }
  button.submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .result {
    margin-top: 20px;
    padding: 16px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 12px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 280px;
    overflow-y: auto;
    display: none;
    font-family: 'Courier New', monospace;
    line-height: 1.5;
  }
  .result.show { display: block; }
  .result.success {
    border-left: 4px solid #22c55e;
    color: #86efac;
  }
  .result.error {
    border-left: 4px solid #ef4444;
    color: #fca5a5;
  }
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: #555;
  }
  .footer a {
    color: #7873f5;
    text-decoration: none;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <div class="logo">🎯</div>
      <h1>RCH Tools</h1>
      <p class="subtitle">Kirim reaction ke pesan channel WhatsApp</p>
    </div>

    <div class="field">
      <label for="url">Link Pesan Channel</label>
      <input type="text" id="url" placeholder="https://whatsapp.com/channel/xxx/5">
    </div>

    <div class="field">
      <label>Pilih Reaction</label>
      <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-btn active" data-emoji="👍">👍</div>
        <div class="emoji-btn" data-emoji="❤️">❤️</div>
        <div class="emoji-btn" data-emoji="😂">😂</div>
        <div class="emoji-btn" data-emoji="😮">😮</div>
        <div class="emoji-btn" data-emoji="😢">😢</div>
        <div class="emoji-btn" data-emoji="🙏">🙏</div>
      </div>
    </div>

    <button class="submit" id="submitBtn" onclick="kirimReact()">🚀 Kirim Reaction</button>

    <div class="result" id="result"></div>

    <div class="footer">
      Powered by <a href="https://apiii-xrina.vercel.app" target="_blank">Xrina API</a>
    </div>
  </div>
</div>

<script>
  // Request lewat server sendiri (/api/rch), API key disimpan di server
  const API_URL = "/api/rch";

  let selectedEmoji = "👍";

  // Emoji picker
  document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedEmoji = btn.dataset.emoji;
    });
  });

  // Submit
  async function kirimReact() {
    const url = document.getElementById("url").value.trim();
    const btn = document.getElementById("submitBtn");
    const result = document.getElementById("result");

    if (!url) {
      result.className = "result error show";
      result.textContent = "❌ Masukkan link channel dulu!";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Mengirim...';
    result.className = "result show";
    result.textContent = "⏳ Sedang memproses...";

    try {
      const finalUrl = `${API_URL}?url=${encodeURIComponent(url)}&reaction=${encodeURIComponent(selectedEmoji)}`;
      const res = await fetch(finalUrl);
      const data = await res.json();

      if (data.status) {
        result.className = "result success show";
        result.textContent = "✅ " + (data.data?.message || "Berhasil") + "\n\n" + JSON.stringify(data, null, 2);
      } else {
        result.className = "result error show";
        result.textContent = "❌ " + (data.message || "Gagal mengirim reaction");
      }
    } catch (err) {
      result.className = "result error show";
      result.textContent = "❌ Error: " + err.message;
    } finally {
      btn.disabled = false;
      btn.innerHTML = "🚀 Kirim Reaction";
    }
  }

  // Enter key buat submit
  document.getElementById("url").addEventListener("keypress", (e) => {
    if (e.key === "Enter") kirimReact();
  });
</script>
</body>
</html>
